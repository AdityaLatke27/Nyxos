name: robbins-polar
on:
  push:
    branches: [data-lp]
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir w
          curl -sSL -m 1500 --retry 3 -o w/robbins.dl "https://astrogeology.usgs.gov/ckan/dataset/f89f5478-b69a-486c-b9b5-30d7b0c5ad2b/resource/c4f25cc2-4f8a-4207-a845-5e176da3ac5a/download/lunar_crater_database_robbins_2018"
          ls -l w
          python3 tools/robbins_polar.py | tee w/report.txt
          git config user.name ci; git config user.email ci@x
          git checkout --orphan landing-robbins
          git rm -rf . -q
          cp w/robbins_polar.csv.gz w/report.txt .
          git add robbins_polar.csv.gz report.txt
          git commit -qm "Robbins polar subset [skip ci]"
          git push -f origin landing-robbins
