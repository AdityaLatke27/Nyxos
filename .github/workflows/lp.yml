name: lp-hydrogen
on:
  push:
    branches: [data-lp]
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir w
          for f in hydrogenhd.txt hydrogenlow.txt; do curl -sSL -m 300 --retry 3 -o w/$f https://pds-geosciences.wustl.edu/missions/lunarp/reduced/$f; done
          python3 tools/build_lp_hydrogen.py
          git config user.name ci; git config user.email ci@x
          git checkout --orphan landing-lp
          git rm -rf . -q
          cp w/lp_h.json .
          git add lp_h.json
          git commit -qm "LP hydrogen polar subset [skip ci]"
          git push -f origin landing-lp
