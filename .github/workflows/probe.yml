name: probe-nasa-data
on:
  push:
    branches: [probe2]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for n in 90 98; do
            echo "#### products/$n"; curl -sSL -m 40 -A "Mozilla/5.0 NYXOS" https://pgda.gsfc.nasa.gov/products/$n | python3 -c "
          import sys,re,html
          t=sys.stdin.read()
          t=re.sub(r'(?s)<(script|style).*?</\1>','',t)
          fl=re.findall(r'href=\"([^\"]+\.(?:TIF|tif))\"',t)
          t=re.sub(r'<[^>]+>',' ',t); t=html.unescape(re.sub(r'\s+',' ',t))
          print(t[:6000]); print('FILES'); print('\n'.join(fl))"
          done
          for u in LDRM_83S_10MPP_ADJ LDRM_80S_20MPP_ADJ LDRM_75S_30MPP_ADJ LDRM_60S_60MPP_ADJ LPSR_83S_10MPP_ADJ LPSR_85S_10MPP_ADJ LPSR_80S_20MPP_ADJ LPSR_75S_30MPP_ADJ LPSR_60S_60MPP_ADJ LDEM_83S_10MPP_ADJ_ERR LDEM_83S_10MPP_ADJ_EFFRES LDEC_83S_10MPP_ADJ; do
            echo $u; curl -sSIL -m 30 -A "Mozilla/5.0 NYXOS" https://pgda.gsfc.nasa.gov/data/LOLA_20mpp/$u.TIF | grep -aiE "^HTTP|content-length"; done
