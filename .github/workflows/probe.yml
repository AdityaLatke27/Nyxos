name: probe-nasa-data
on:
  push:
    branches: [probe2]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: |
          set +e
          sudo apt-get install -y -qq gdal-bin aria2 python3-gdal >/dev/null 2>&1
          mkdir -p w && cd w
          D=http://luna1.diviner.ucla.edu/~jpierre/diviner/level4_polar
          for f in 24x6_240m/additional_maps/polar_south_80_Tmax.grd 24x6_240m/additional_maps/polar_south_80_Tmean.grd 24x6_240m/additional_maps/polar_south_80_zit.grd 24x6_240m/additional_maps/aareadme.txt additional_maps/fraction_below_110_south_summer.grd additional_maps/fraction_below_110_south_summer.txt additional_maps/fraction_below_110_south_winter.grd; do curl -sS --ciphers 'DEFAULT@SECLEVEL=0' -k -m 120 -O $D/$f; done
          ls -la
          echo "#### aareadme additional"; cat aareadme.txt | head -60
          echo "#### fraction txt"; cat fraction_below_110_south_summer.txt | head -30
          for f in polar_south_80_Tmax.grd polar_south_80_Tmean.grd polar_south_80_zit.grd fraction_below_110_south_summer.grd; do echo "#### $f"; gdalinfo -stats $f 2>&1 | grep -vE "^\s+(PROJCRS|BASEGEOGCRS|DATUM|ELLIPSOID|LENGTHUNIT|ID\[|PRIMEM|ANGLEUNIT|CONVERSION|METHOD|PARAMETER|SCALEUNIT|CS\[|AXIS|MERIDIAN|ORDER)" | head -40; done
          B=https://pgda.gsfc.nasa.gov/data/LOLA_20mpp
          for f in LDRM_80S_50MPP_ADJ_ROUGH_100M LDRM_80S_50MPP_ADJ_SLP_100M LPSR_80S_20MPP_ADJ; do aria2c -q -x16 -s16 -k4M --user-agent="Mozilla/5.0 NYXOS" -d . -o $f.TIF $B/$f.TIF; echo "#### $f"; gdalinfo -stats $f.TIF 2>&1 | grep -E "Size is|Origin|Pixel Size|Type=|NoData|Minimum|STATISTICS|Corner|Upper|Lower|Band|Offset|Scale|Unit" | head -30; done
          echo "#### xml"; curl -sS -m 60 $B/LDRM_80S_50MPP_ADJ_ROUGH_100M.XML | head -c 1500
          echo "#### LPSR xml"; curl -sS -m 60 $B/LPSR_80S_20MPP_ADJ.XML | head -c 1500
