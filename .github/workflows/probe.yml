name: zenodo-probe
on:
  push:
    branches: [probe2]
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set +e
          mkdir w && cd w
          curl -sSL -m 60 https://zenodo.org/api/records/13990480 | python3 -c "import json,sys;d=json.load(sys.stdin);m=d['metadata'];import re;print(re.sub('<[^>]+>',' ',m.get('description','')));print(m.get('license'),m.get('publication_date'),m.get('version'));print(m.get('related_identifiers'));print(d.get('doi'))" > desc.txt; echo "=== DESC"; cat desc.txt | cut -c1-3000
          curl -sSL -m 900 -o c.csv "https://zenodo.org/api/records/13990480/files/Moon_Diamond_catalog_4.csv/content"; ls -l c.csv
          echo "=== HEAD"; head -4 c.csv | cut -c1-600; wc -l c.csv
          python3 - <<'PY'
          import csv,sys
          r=csv.reader(open('c.csv'));h=next(r);print(h)
          idx={k:i for i,k in enumerate(h)}
          print(idx)
          PY
