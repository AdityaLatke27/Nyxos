name: probe-nasa-data
on:
  push:
    branches: [probe2]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          C() { curl -sSL --ciphers 'DEFAULT@SECLEVEL=0' -k -m 90 -A "Mozilla/5.0 NYXOS" "$@"; }
          B=http://luna1.diviner.ucla.edu/~jpierre/diviner
          echo "#### aareadme"; C $B/level4_polar/aareadme.txt | head -120
          for d in 24x6_240m/pds 24x6_240m/additional_maps additional_maps hourly_maps pds; do echo "#### $d"; C $B/level4_polar/$d/ | grep -aoE 'href="[^"?/][^"]*"' | head -25; done
          echo "#### tbol_max desc"; C $B/level4_raster_data/diviner_tbol_max_description.txt | head -30
          echo "#### crater dl"; curl -sSIL -m 120 https://astropedia.astrogeology.usgs.gov/download/Moon/Research/Craters/lunar_crater_database_robbins_2018/ | grep -aiE "^HTTP|content-length|location"
