name: zenodo-probe
on:
  push:
    branches: [probe2]
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          set +e
          curl -sSL -m 60 -o p.html https://astrogeology.usgs.gov/search/map/moon_crater_database_v1_robbins
          echo "=== LINKS"; grep -oE 'https?://[^"'"'"' <>)]+' p.html | grep -iE "robbins|download|csv|zip|astropedia|pds|\.tab|gpkg|shp|geo" | sort -u | head -40
