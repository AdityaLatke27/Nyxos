name: avgvis-sample
on:
  push:
    branches: [probe2]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -qq aria2 >/dev/null; pip install -q rasterio numpy
          curl -sSL -m 60 -A "Mozilla/5.0 NYXOS" https://pgda.gsfc.nasa.gov/products/69 | grep -aoE 'href="[^"]+\.(TIF|IMG|LBL|JP2)"' | sed 's/.*data\///' | head -80
          python3 tools/sample_avgvis.py
          git config user.name nyxos-data-bot; git config user.email bot@users.noreply.github.com
          mkdir -p /tmp/o && cp out/avgvis_ref.csv /tmp/o/ && git checkout --orphan avgvis-ref && git rm -rf -q --cached . && rm -rf $(ls -A | grep -v '^\.git$') 2>/dev/null; cp /tmp/o/avgvis_ref.csv . && git add -f avgvis_ref.csv && git commit -q -m "AVGVISIB samples [skip ci]" && git push -f origin avgvis-ref
