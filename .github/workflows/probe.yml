name: zenodo-probe
on:
  push:
    branches: [probe2]
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          set +e
          mkdir w && cd w
          for f in Landing_Sites Illumination_Modeling PSR_Volatile_Estimates; do curl -sSL -m 300 -o $f.zip https://zenodo.org/api/records/17084058/files/$f.zip/content; mkdir $f; (cd $f && unzip -q -o ../$f.zip); done
          find . -type f ! -name "*.zip" | head -150
          echo "#### SMALL TEXT FILES"
          for f in $(find . -type f \( -name "*.csv" -o -name "*.txt" -o -name "*.md" -o -name "*.json" \) | head -12); do echo "=== $f ($(wc -c <$f) bytes)"; head -c 1500 $f; echo; done
