name: probe-nasa-data
on:
  push:
    branches: [data-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Product page text and TIFF tags
        run: |
          set +e
          pip install -q rasterio numpy pyproj
          curl -sSL -m 60 https://pgda.gsfc.nasa.gov/products/90 | python3 -c "
          import sys,re,html
          t=sys.stdin.read()
          t=re.sub(r'(?s)<(script|style).*?</\1>','',t); t=re.sub(r'<[^>]+>',' ',t); t=html.unescape(re.sub(r'\s+',' ',t))
          print(t[:6000])"
          python3 - <<'PY'
          import rasterio, numpy as np
          B="https://pgda.gsfc.nasa.gov/data/LOLA_20mpp/"
          for n in ["LDSM_83S_10MPP_ADJ.TIF","LDEM_83S_10MPP_ADJ_ERR.TIF","LDEM_83S_10MPP_ADJ_EFFRES.TIF","LDEM_83S_10MPP_ADJ_HILL.TIF","LDSM_83S_10MPP_ADJ_ERR.TIF","LDEM_80S_20MPP_ADJ_EFFRES.TIF"]:
            try:
              with rasterio.Env(GDAL_DISABLE_READDIR_ON_OPEN="EMPTY_DIR"):
                with rasterio.open("/vsicurl/"+B+n) as d:
                  print("##",n,d.dtypes[0],d.shape,"tags",d.tags(),d.tags(1),"desc",d.descriptions)
                  # Shackleton rim neighbourhood: polar-stereographic x,y near (lat -89.9 lon 129)
                  w=rasterio.windows.Window(21640-100,21640+100,200,200)
                  a=d.read(1,window=w); print("   sample stats",np.nanmin(a),np.nanmedian(a),np.nanmax(a))
            except Exception as e: print("ERR",n,str(e)[:150])
          PY
      - name: North polar and cylindrical file names
        run: |
          curl -sSL -m 60 https://pgda.gsfc.nasa.gov/products/90 | grep -aoE 'LDEM_[0-9]+N_[0-9]+MPP_ADJ[A-Z_]*\.TIF' | sort -u | head -20
          for u in https://pgda.gsfc.nasa.gov/data/LOLA_20mpp/LDEM_83N_10MPP_ADJ.TIF https://pgda.gsfc.nasa.gov/data/LOLA_20mpp/LDEM_60N_60MPP_ADJ.TIF; do echo $u; curl -sSIL -m 30 $u | grep -iE 'HTTP/|content-length|content-type' | tr -d '\r'; done
