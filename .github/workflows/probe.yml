name: zenodo-probe
on:
  push:
    branches: [probe2]
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          set +e
          sudo apt-get install -y -qq gdal-bin >/dev/null 2>&1
          mkdir w && cd w
          for f in Landing_Sites Illumination_Modeling; do curl -sSL -m 300 -o $f.zip https://zenodo.org/api/records/17084058/files/$f.zip/content; mkdir $f; (cd $f && unzip -o ../$f.zip >/dev/null && unzip -o $f.zip -d data >/dev/null); done
          find . -type f ! -name "*.lyrx" ! -name "*.zip" | head -80
          for f in $(find . -name "*.shp" | head -6); do echo "######## $f"; ogrinfo -so -al $f 2>&1 | head -45; done
          for f in $(find . \( -name "*.tif" -o -name "*.img" \) | head -4); do echo "######## $f"; gdalinfo -stats $f 2>&1 | grep -E "Size is|Origin|Pixel Size|Minimum|Type=|NoData|PROJCRS|METHOD|PARAMETER" | head -20; done
