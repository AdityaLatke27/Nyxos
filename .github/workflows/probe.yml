name: probe-nasa-data
on:
  push:
    branches: [probe2]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Product pages
        run: |
          set +e
          for n in 56 57 62 63 64 66 69 71 73 80 82 83 84 85 87 88 89 91 92 93 94 95 96 97 98 99 100 101 102 104 105 106; do
            echo "#### products/$n"; curl -sSL -m 40 -A "Mozilla/5.0 NYXOS" https://pgda.gsfc.nasa.gov/products/$n | python3 -c "
          import sys,re,html
          t=sys.stdin.read()
          t=re.sub(r'(?s)<(script|style).*?</\1>','',t)
          fl=re.findall(r'href=\"([^\"]+\.(?:TIF|tif|IMG|img|zip|csv|CSV|tab|TAB|LBL|lbl|xyz|json))\"',t)
          t=re.sub(r'<[^>]+>',' ',t); t=html.unescape(re.sub(r'\s+',' ',t))
          i=t.find('Moon') 
          print(t[300:800]); print('FILES',fl[:8])"
          done
      - name: Diviner and PDS
        run: |
          set +e
          for u in https://luna1.diviner.ucla.edu/~jpierre/diviner/ https://luna1.diviner.ucla.edu/~jpierre/diviner/level4_rdr_v1/ https://pds-geosciences.wustl.edu/lro/lro-l-dlre-4-rdr-v1/lrodlr_1001/ https://pds-geosciences.wustl.edu/lro/lro-l-lend-4-cdr-v1/ ; do
            echo "#### $u"; curl -ksSL -m 60 -A "Mozilla/5.0 NYXOS" "$u" | grep -aoE 'href="[^"?][^"]*"' | grep -v -E 'nasa.gov|wustl.edu|css|mailto|pds.nasa|firstgov|jpl.nasa' | head -60; done
