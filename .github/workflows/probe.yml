name: zenodo-probe
on:
  push:
    branches: [probe2]
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          set +e
          curl -sSL -m 60 https://zenodo.org/api/records/17084058 | python3 -c "
          import sys,json
          d=json.load(sys.stdin); m=d.get('metadata',{})
          print('TITLE',m.get('title')); print('DATE',m.get('publication_date')); print('CREATORS',[c['name'] for c in m.get('creators',[])][:8])
          import re; print('DESC',re.sub('<[^>]+>',' ',m.get('description',''))[:2500])
          for f in d.get('files',[]): print('FILE',f['key'],f['size'],f['links'].get('self'))
          print('REL',m.get('related_identifiers'))"
