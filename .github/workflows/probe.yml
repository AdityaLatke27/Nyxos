name: probe-nasa-data
on:
  push:
    branches: [probe2]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          sudo apt-get install -y -qq gdal-bin >/dev/null 2>&1
          B=https://pgda.gsfc.nasa.gov/data
          for u in LOLA_20mpp/LDRM_80S_50MPP_ADJ_ROUGH_100M.TIF LOLA_20mpp/LDRM_80S_50MPP_ADJ_SLP_100M.TIF LOLA_20mpp/LPSR_80S_20MPP_ADJ.TIF LOLA_20mpp/LDEM_80S_80MPP_ADJ.TIF LOLA_20mpp/LDSM_83S_10MPP_ADJ.TIF MoonIllumination/AVGVISIB_85S_060M_201608.TIF; do
            echo "#### $u"; gdalinfo -stats "/vsicurl/$B/$u" 2>&1 | grep -vE "^\s+(Overviews|Metadata)" | head -45; done
          echo "#### LPSR csv head"; curl -sSL -m 60 -r 0-1500 $B/LOLA_20mpp/LPSR_80S_20MPP_ADJ.CSV | head -5
          for u in "https://luna1.diviner.ucla.edu/~jpierre/diviner/" "https://luna1.diviner.ucla.edu/~jpierre/diviner/level4_rdr_v1/"; do echo "#### $u"; curl -sSL --ciphers 'DEFAULT@SECLEVEL=0' -k -m 60 "$u" | grep -aoE 'href="[^"?][^"]*"' | head -60; done
