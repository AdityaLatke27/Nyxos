name: probe-nasa-data
on:
  push:
    branches: [data-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Directory listings
        run: |
          set +e
          ls_() { echo "#### $1"; curl -sSL -m 60 -A "Mozilla/5.0 NYXOS" "$1" | grep -aoE 'href="[^"?][^"]*"' | head -${2:-60}; }
          ls_ https://pgda.gsfc.nasa.gov/data/ 80
          ls_ https://pgda.gsfc.nasa.gov/data/MoonIllumination/ 60
          ls_ https://pgda.gsfc.nasa.gov/data/LOLA_PSR/ 40
          ls_ https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/ 40
          ls_ https://pds-geosciences.wustl.edu/lro/lro-l-dlre-4-rdr-v1/lrodlr_1001/data/gdr/polar/ 60
          ls_ https://pds-geosciences.wustl.edu/lro/lro-l-dlre-4-rdr-v1/lrodlr_1001/ 40
          ls_ https://pds-geosciences.wustl.edu/lro/lro-l-lamp-4-gdr-v1/ 30
          ls_ https://pds-geosciences.wustl.edu/lro/lro-l-mrflro-5-cpr-v1/ 30
          ls_ https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/ 60
          ls_ https://naif.jpl.nasa.gov/pub/naif/generic_kernels/fk/satellites/ 60
          ls_ https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/ 30
      - name: PGDA page text for products 
        run: |
          for n in 85 86 87 88 89 91 92 93; do
            echo "#### products/$n"; curl -sSL -m 40 -A "Mozilla/5.0 NYXOS" https://pgda.gsfc.nasa.gov/products/$n | python3 -c "
          import sys,re,html
          t=sys.stdin.read()
          t=re.sub(r'(?s)<(script|style).*?</\1>','',t); t=re.sub(r'<[^>]+>',' ',t); t=html.unescape(re.sub(r'\s+',' ',t))
          print(t[:700])"
          done
