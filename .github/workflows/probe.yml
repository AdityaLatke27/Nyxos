name: zenodo-probe
on:
  push:
    branches: [probe2]
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: |
          set +e
          mkdir w && cd w
          echo "=== PYGEOAPI MOON"; curl -sSL -m 90 -w "\nHTTP %{http_code} %{size_download}\n" "https://astrogeology.usgs.gov/pygeoapi/collections?f=json" | python3 -c "import sys,json;t=sys.stdin.read();i=t.rfind('\nHTTP');print(t[i:]);d=json.loads(t[:i]);print([c['id'] for c in d['collections']])" 2>&1 | head -8
          curl -sSL -m 120 -w "\nHTTP %{http_code} %{size_download}\n" "https://astrogeology.usgs.gov/pygeoapi/collections/moon/robbinsv1/items?f=json&limit=3" | cut -c1-900 | head -12
          echo "=== ASTROPEDIA"; for u in "https://astropedia.astrogeology.usgs.gov/download/Moon/Research/Craters/lunar_crater_database_robbins_2018.csv" "https://astropedia.astrogeology.usgs.gov/download/Moon/Research/Craters/lunar_crater_database_robbins_2018" "https://pdsimage2.wr.usgs.gov/Individual_Investigations/moon_lro.kaguya_multi_craterdatabase_robbins_2018/data/"; do curl -sSL -m 200 -o t.bin -w "$u -> HTTP %{http_code} %{size_download}\n" "$u"; head -c 300 t.bin | head -3; echo; done
          echo "=== ZENODO 13990480"; curl -sSL -m 60 https://zenodo.org/api/records/13990480 | python3 -c "import json,sys;d=json.load(sys.stdin);m=d['metadata'];print(m['title']);print(m.get('description','')[:700]);print([(f['key'],f['size']) for f in d['files']])"
