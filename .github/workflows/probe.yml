name: probe-nasa-data
on:
  push:
    branches: [probe2]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set +e
          curl -sSL -m 60 -A "Mozilla/5.0 NYXOS" https://pgda.gsfc.nasa.gov/products/69 | python3 -c "
          import sys,re,html
          t=sys.stdin.read()
          t=re.sub(r'(?s)<(script|style).*?</\1>','',t)
          t=re.sub(r'<[^>]+>',' ',t); t=html.unescape(re.sub(r'\s+',' ',t))
          print(t[:5500])"
          for u in https://astropedia.astrogeology.usgs.gov/download/Moon/Research/Craters/lunar_crater_database_robbins_2018/ https://pdsimage2.wr.usgs.gov/archive/ https://zenodo.org/api/records?q=robbins%20lunar%20crater%20database; do echo "#### $u"; curl -sSL -m 45 -A "Mozilla/5.0 NYXOS" "$u" | head -c 1200; echo; done
          for u in https://pds-geosciences.wustl.edu/lro/lro-l-lend-2-edr-v1/ https://pds-geosciences.wustl.edu/lro/lro-l-lend-4-rdr-v1/ https://ode.rsl.wustl.edu/moon/pagehelp/Content/Missions_Instruments/LRO/LEND/Derived_Data.htm; do echo "#### $u"; curl -sSL -m 30 -A "Mozilla/5.0 NYXOS" "$u" | python3 -c "
          import sys,re,html
          t=sys.stdin.read(); fl=re.findall(r'href=\"([^\"]+)\"',t)
          t=re.sub(r'(?s)<(script|style).*?</\1>','',t); t=re.sub(r'<[^>]+>',' ',t); t=html.unescape(re.sub(r'\s+',' ',t))
          print(t[:1500]); print([f for f in fl if 'css' not in f][:25])"; done
