name: build-landing-data
on:
  push:
    branches: [data-build]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk and prepare work dir
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo mkdir -p /mnt/work && sudo chown $USER /mnt/work
          df -h / /mnt | cat
      - run: pip install -q rasterio numpy pillow
      - name: Build tiles
        run: python3 tools/build_landing_tiles.py public/landing
      - name: Size report
        run: du -sh public/landing public/landing/* | cat; ls public/landing | head
      - name: Publish to landing-data branch
        run: |
          git config user.name "nyxos-data-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout --orphan landing-data
          git rm -rf -q --cached . 
          git add -f public/landing
          git commit -q -m "Landing hazard tiles from NASA PGDA LOLA [skip ci]"
          git push -f origin landing-data
