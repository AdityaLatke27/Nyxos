name: build-landing-data
on:
  workflow_dispatch:
  push:
    branches: [data-build]
permissions:
  contents: write
jobs:
  tier:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        tier: [a]
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo mkdir -p /mnt/work && sudo chown $USER /mnt/work
          sudo apt-get install -y -qq aria2 >/dev/null
          pip install -q rasterio numpy pillow
      - run: python3 tools/build_landing_tiles.py out ${{ matrix.tier }}
      - uses: actions/upload-artifact@v4
        with:
          name: tier-${{ matrix.tier }}
          path: out
  publish:
    needs: tier
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: tier-*
          merge-multiple: true
      - run: |
          mkdir -p public/landing
          git fetch -q origin landing-data && git archive FETCH_HEAD public/landing | tar -x
          cp -r parts/* public/landing/
          python3 - <<'PY'
          import json,glob
          m=None
          for f in sorted(glob.glob('public/landing/manifest_*.json')):
              d=json.load(open(f))
              if m is None: m=d
              else: m['tiers']+=d['tiers']
          old=json.load(open('public/landing/manifest.json')) if __import__('os').path.exists('public/landing/manifest.json') else None
          if old:
              ids={t['id'] for t in m['tiers']}
              m['tiers']+=[t for t in old['tiers'] if t['id'] not in ids]
          m['tiers'].sort(key=lambda t:t['id'])
          json.dump(m,open('public/landing/manifest.json','w'),separators=(',',':'))
          PY
          rm -f public/landing/manifest_*.json
          du -sh public/landing/* | cat
          git config user.name nyxos-data-bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan landing-data; git rm -rf -q --cached .
          git add -f public/landing
          git commit -q -m "Landing hazard tiles from NASA PGDA LOLA [skip ci]"
          git push -f origin landing-data
